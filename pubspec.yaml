name: flird
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  aligned_dialog: ^0.0.7
  auto_size_text: ^3.0.0
  board_datetime_picker: ^2.5.0
  collection: ^1.19.0
  device_info_plus: 11.3.0
  dio: ^5.7.0
  drift: ^2.25.1
  easy_debounce: ^2.0.3
  flutter:
    sdk: flutter
  flutter_animate: 4.5.0
  flutter_cache_manager: 3.4.1
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_smart_dialog: ^4.9.8+5
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  get: ^4.7.2
  google_fonts: ^6.2.1
  google_nav_bar: ^5.0.7
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  in_app_purchase: ^3.1.5
  in_app_purchase_storekit: ^0.3.16
  intl: 0.19.0
  json_path: 0.7.2
  just_audio: ^0.9.46
  loading_animation_widget: ^1.3.0
  numberpicker: ^2.1.2
  package_info_plus: ^8.3.0
  page_transition: 2.1.0
  path: ^1.9.0
  path_provider: 2.1.4
  path_provider_android: 2.2.10
  path_provider_foundation: 2.4.0
  path_provider_platform_interface: 2.1.2
  permission_handler: ^11.4.0
  provider: 6.1.2
  record: 5.0.4
  record_android: 1.0.4
  screenshot: ^3.0.0
  shared_preferences: 2.3.2
  shared_preferences_android: 2.3.2
  shared_preferences_foundation: 2.5.2
  shared_preferences_platform_interface: 2.4.1
  simple_gradient_text: ^1.3.0
  sliver_tools: ^0.2.12
  smooth_page_indicator: ^1.2.1
  sqflite: 2.3.3+1
  sqflite_common: 2.5.4+3
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.26
  string_validator: ^1.1.0
  timeago: ^3.7.0
  url_launcher: 6.3.0
  url_launcher_android: 6.3.10
  url_launcher_ios: 6.3.1
  url_launcher_platform_interface: 2.3.2
  video_compress: ^3.1.4
  video_player: ^2.9.5
  wechat_assets_picker: ^9.5.0
dev_dependencies:
  build_runner: 2.4.15
  drift_dev: 2.25.2
  flutter_launcher_icons: 0.13.1
  flutter_lints: 4.0.0
  flutter_native_splash: ^2.3.2
  lints: 4.0.0
dependency_overrides:
  http: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/databases/
    - assets/appImages/
    - assets/appVideos/
  fonts:
    - family: "ShuHeiTi"
      fonts:
        - asset: assets/fonts/ShuHeiTi.ttf
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/flird_logo.png"

flutter_native_splash:
  background_image: "assets/images/flird_splash.png"
  android_gravity: center|fill
  ios_content_mode: scaleToFill
  fullscreen: true
