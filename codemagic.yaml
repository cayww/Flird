workflows:
  ios-workflow:
    name: flird2
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: flird2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.effortirony.flirdclean
      vars:
        APP_ID: 6747338396
      flutter: "3.32.4"
      xcode: "16.1"
      cocoapods: 1.16.1
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Update iOS deployment target to 14.0
        script: |
          echo "🧩 Updating iOS deployment target to 14.0 ..."
          sed -i.bak "s/platform :ios, '13.0'/platform :ios, '14.0'/" ios/Podfile || true
          cd ios
          pod deintegrate
          pod repo update
          pod install
          cd ..

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa and automatic versioning
        script: |
          flutter build ipa --release --obfuscate --split-debug-info=/Users/builder/debug-info \
            --build-name=1.4.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
