workflows:
  ios-workflow:
    name: flird2
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: "3.32.4"
      xcode: "16.1"
      cocoapods: 1.16.1
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.effortirony.flirdclean
      vars:
        APP_ID: 6747338396
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Flutter pub get
        script: flutter pub get
      - name: Clean & Install Pods
        script: |
          flutter clean
          cd ios
          rm -rf Pods Podfile.lock Runner.xcworkspace
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build IPA
        script: |
          flutter build ipa --release --obfuscate --split-debug-info=/Users/builder/debug-info \
            --build-name=1.4.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
